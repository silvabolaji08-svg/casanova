<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casanova — Homes in London</title>
    <meta
      name="description"
      content="Search London homes on the map, filter by area and price, and book a viewing in a few clicks."
    />

    <!-- Warm the connection to the font host before the CSS asks for a file. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before React mounts, so a dark-mode visitor never sees
         a flash of the light palette. Inline and synchronous on purpose. -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('casanova.theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch (e) {
          /* private windows throw on localStorage — light theme is fine */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
